<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding Stats Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5, #00d2ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #00d2ff;
            background: rgba(255, 255, 255, 0.15);
        }

        .upload-section.dragover {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.1);
        }

        .upload-btn {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.4);
        }

        .file-input {
            display: none;
        }

        /* Repo Selector Styles */
        .repo-selector {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .repo-selector-title {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        .repo-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .repo-tab {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .repo-tab:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00d2ff;
        }

        .repo-tab.active {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border-color: transparent;
            font-weight: bold;
        }

        .current-repo-name {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00d2ff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card .label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart-container.full-width {
            grid-column: span 2;
        }

        .chart-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #00d2ff;
        }

        .chart {
            width: 100%;
            height: 400px;
        }

        .chart.small {
            height: 300px;
        }

        .chart.large {
            height: 500px;
        }

        .hidden {
            display: none;
        }

        .leaderboard {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.3s ease;
        }

        .leaderboard-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .rank {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
        }

        .rank-1 { background: linear-gradient(135deg, #ffd700, #ffb800); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #000; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #b87333); color: #fff; }
        .rank-other { background: rgba(255, 255, 255, 0.2); }

        .leaderboard-info {
            flex: 1;
        }

        .leaderboard-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .leaderboard-stats {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .leaderboard-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d2ff;
        }

        .section-title {
            font-size: 1.5rem;
            margin: 30px 0 20px;
            padding-left: 15px;
            border-left: 4px solid #00d2ff;
        }

        @media (max-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .chart-container.full-width {
                grid-column: span 1;
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Coding Stats Visualizer</h1>

        <div class="upload-section" id="uploadSection">
            <p style="margin-bottom: 20px; font-size: 1.1rem;">
                拖拽 CSV 文件到这里，或点击下方按钮上传
            </p>
            <input type="file" id="fileInput" class="file-input" accept=".csv">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                选择 CSV 文件
            </button>
            <p style="margin-top: 15px; font-size: 0.9rem; color: rgba(255,255,255,0.6);">
                支持格式：仓库,用户,日期,创建PR数,合并PR数,最早PR创建时间,最晚PR创建时间
            </p>
        </div>

        <div id="dashboard" class="hidden">
            <!-- Repo Selector -->
            <div class="repo-selector">
                <div class="repo-selector-title">选择仓库查看详情：</div>
                <div class="repo-tabs" id="repoTabs"></div>
            </div>

            <div class="current-repo-name" id="currentRepoName">全部仓库</div>

            <!-- 总览统计卡片 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="number" id="totalRepos">0</div>
                    <div class="label" id="repoLabel">仓库总数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalUsers">0</div>
                    <div class="label">参与用户</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalPRs">0</div>
                    <div class="label">创建PR总数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="aiRatio">0%</div>
                    <div class="label">AI Coding 浓度</div>
                </div>
            </div>

            <!-- 图表区域 -->
            <h2 class="section-title">数据概览</h2>
            <div class="charts-grid">
                <div class="chart-container">
                    <div class="chart-title">每日 PR 趋势</div>
                    <div id="dailyTrendChart" class="chart"></div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">用户贡献分布</div>
                    <div id="userPieChart" class="chart"></div>
                </div>
            </div>

            <!-- 仓库对比图 - 只在全部视图显示 -->
            <div id="repoCompareSection">
                <div class="charts-grid">
                    <div class="chart-container full-width">
                        <div class="chart-title">仓库 PR 统计对比</div>
                        <div id="repoBarChart" class="chart large"></div>
                    </div>
                </div>
            </div>

            <h2 class="section-title">AI vs 人类贡献</h2>
            <div class="charts-grid">
                <div class="chart-container">
                    <div class="chart-title">AI vs 人类 PR 数量</div>
                    <div id="aiVsHumanChart" class="chart"></div>
                </div>
                <div class="chart-container" id="aiRatioByRepoContainer">
                    <div class="chart-title">各仓库 AI 浓度</div>
                    <div id="aiRatioByRepoChart" class="chart"></div>
                </div>
            </div>

            <h2 class="section-title">时间分析</h2>
            <div class="charts-grid">
                <div class="chart-container full-width">
                    <div class="chart-title">工作时间热力图（按小时）</div>
                    <div id="heatmapChart" class="chart large"></div>
                </div>
            </div>

            <h2 class="section-title">排行榜</h2>
            <div class="charts-grid">
                <div class="chart-container">
                    <div class="chart-title">用户 PR 排行榜 (Top 10)</div>
                    <div class="leaderboard" id="userLeaderboard"></div>
                </div>
                <div class="chart-container" id="repoLeaderboardContainer">
                    <div class="chart-title">仓库活跃度排行榜 (Top 10)</div>
                    <div class="leaderboard" id="repoLeaderboard"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局数据
        let rawData = [];
        let filteredData = [];
        let charts = {};
        let selectedRepo = null; // null = 全部

        // 文件上传处理
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');

        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.csv')) {
                processFile(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                processFile(file);
            }
        });

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const csv = e.target.result;
                parseCSV(csv);
            };
            reader.readAsText(file);
        }

        function parseCSV(csv) {
            const lines = csv.split('\n');
            rawData = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line || line.startsWith(',')) continue;

                const cols = parseCSVLine(line);
                if (cols.length >= 5 && cols[0]) {
                    rawData.push({
                        repo: cols[0],
                        user: cols[1],
                        date: cols[2],
                        createdPRs: parseInt(cols[3]) || 0,
                        mergedPRs: parseInt(cols[4]) || 0,
                        earliestTime: cols[5] || '',
                        latestTime: cols[6] || ''
                    });
                }
            }

            if (rawData.length > 0) {
                document.getElementById('dashboard').classList.remove('hidden');
                renderRepoTabs();
                selectRepo(null);
            }
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        function getRepoName(url) {
            return url.replace('https://github.com/', '').replace('.git', '');
        }

        function renderRepoTabs() {
            const repos = [...new Set(rawData.map(d => d.repo))];
            const container = document.getElementById('repoTabs');

            let html = `<div class="repo-tab active" onclick="selectRepo(null)">全部仓库 (${repos.length})</div>`;
            repos.forEach(repo => {
                const name = getRepoName(repo);
                html += `<div class="repo-tab" onclick="selectRepo('${repo}')">${name}</div>`;
            });

            container.innerHTML = html;
        }

        function selectRepo(repo) {
            selectedRepo = repo;

            // 更新 tab 样式
            document.querySelectorAll('.repo-tab').forEach((tab, index) => {
                if (repo === null && index === 0) {
                    tab.classList.add('active');
                } else if (repo && tab.textContent.includes(getRepoName(repo))) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            // 过滤数据
            if (repo === null) {
                filteredData = rawData;
                document.getElementById('currentRepoName').textContent = '全部仓库';
                document.getElementById('repoLabel').textContent = '仓库总数';
                document.getElementById('repoCompareSection').style.display = 'block';
                document.getElementById('aiRatioByRepoContainer').style.display = 'block';
                document.getElementById('repoLeaderboardContainer').style.display = 'block';
            } else {
                filteredData = rawData.filter(d => d.repo === repo);
                document.getElementById('currentRepoName').textContent = getRepoName(repo);
                document.getElementById('repoLabel').textContent = '活跃天数';
                document.getElementById('repoCompareSection').style.display = 'none';
                document.getElementById('aiRatioByRepoContainer').style.display = 'none';
                document.getElementById('repoLeaderboardContainer').style.display = 'none';
            }

            renderDashboard();
        }

        function renderDashboard() {
            // 计算统计数据
            const repos = [...new Set(filteredData.map(d => d.repo))];
            const users = [...new Set(filteredData.map(d => d.user))];
            const dates = [...new Set(filteredData.map(d => d.date))];
            const totalCreatedPRs = filteredData.reduce((sum, d) => sum + d.createdPRs, 0);
            const aiPRs = filteredData.filter(d => d.user === 'xgopilot[bot]').reduce((sum, d) => sum + d.createdPRs, 0);
            const aiRatio = totalCreatedPRs > 0 ? ((aiPRs / totalCreatedPRs) * 100).toFixed(1) : 0;

            // 更新统计卡片
            document.getElementById('totalRepos').textContent = selectedRepo ? dates.length : repos.length;
            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('totalPRs').textContent = totalCreatedPRs;
            document.getElementById('aiRatio').textContent = aiRatio + '%';

            // 渲染图表
            renderDailyTrendChart();
            renderUserPieChart();
            if (selectedRepo === null) {
                renderRepoBarChart();
                renderAiRatioByRepoChart();
                renderRepoLeaderboard();
            }
            renderAiVsHumanChart();
            renderHeatmapChart();
            renderUserLeaderboard();
        }

        function renderDailyTrendChart() {
            const chart = echarts.init(document.getElementById('dailyTrendChart'));
            charts.dailyTrend = chart;

            const dailyStats = {};
            filteredData.forEach(d => {
                if (!dailyStats[d.date]) {
                    dailyStats[d.date] = { created: 0, merged: 0 };
                }
                dailyStats[d.date].created += d.createdPRs;
                dailyStats[d.date].merged += d.mergedPRs;
            });

            const dates = Object.keys(dailyStats).sort();
            const createdData = dates.map(d => dailyStats[d].created);
            const mergedData = dates.map(d => dailyStats[d].merged);

            const option = {
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(0,0,0,0.8)',
                    textStyle: { color: '#fff' }
                },
                legend: {
                    data: ['创建 PR', '合并 PR'],
                    textStyle: { color: '#fff' }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: dates,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.3)' } },
                    axisLabel: { color: 'rgba(255,255,255,0.7)' }
                },
                yAxis: {
                    type: 'value',
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.3)' } },
                    axisLabel: { color: 'rgba(255,255,255,0.7)' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                },
                series: [
                    {
                        name: '创建 PR',
                        type: 'line',
                        smooth: true,
                        data: createdData,
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(0, 210, 255, 0.5)' },
                                { offset: 1, color: 'rgba(0, 210, 255, 0.05)' }
                            ])
                        },
                        lineStyle: { color: '#00d2ff', width: 3 },
                        itemStyle: { color: '#00d2ff' }
                    },
                    {
                        name: '合并 PR',
                        type: 'line',
                        smooth: true,
                        data: mergedData,
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(58, 123, 213, 0.5)' },
                                { offset: 1, color: 'rgba(58, 123, 213, 0.05)' }
                            ])
                        },
                        lineStyle: { color: '#3a7bd5', width: 3 },
                        itemStyle: { color: '#3a7bd5' }
                    }
                ]
            };
            chart.setOption(option);
        }

        function renderUserPieChart() {
            const chart = echarts.init(document.getElementById('userPieChart'));
            charts.userPie = chart;

            const userStats = {};
            filteredData.forEach(d => {
                if (!userStats[d.user]) {
                    userStats[d.user] = 0;
                }
                userStats[d.user] += d.createdPRs;
            });

            const sortedUsers = Object.entries(userStats)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const option = {
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(0,0,0,0.8)',
                    textStyle: { color: '#fff' },
                    formatter: '{b}: {c} ({d}%)'
                },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: 'rgba(0,0,0,0.3)',
                        borderWidth: 2
                    },
                    label: {
                        show: true,
                        color: '#fff',
                        formatter: '{b}\n{d}%'
                    },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: 16,
                            fontWeight: 'bold'
                        }
                    },
                    data: sortedUsers.map(([name, value], i) => ({
                        name,
                        value,
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 1, 1, [
                                { offset: 0, color: `hsl(${200 + i * 15}, 80%, 60%)` },
                                { offset: 1, color: `hsl(${200 + i * 15}, 80%, 40%)` }
                            ])
                        }
                    }))
                }]
            };
            chart.setOption(option);
        }

        function renderRepoBarChart() {
            const chart = echarts.init(document.getElementById('repoBarChart'));
            charts.repoBar = chart;

            const repoStats = {};
            filteredData.forEach(d => {
                const repoName = getRepoName(d.repo);
                if (!repoStats[repoName]) {
                    repoStats[repoName] = { created: 0, merged: 0 };
                }
                repoStats[repoName].created += d.createdPRs;
                repoStats[repoName].merged += d.mergedPRs;
            });

            const repos = Object.keys(repoStats).sort((a, b) =>
                repoStats[b].created - repoStats[a].created
            );

            const option = {
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(0,0,0,0.8)',
                    textStyle: { color: '#fff' },
                    axisPointer: { type: 'shadow' }
                },
                legend: {
                    data: ['创建 PR', '合并 PR'],
                    textStyle: { color: '#fff' }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: repos,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.3)' } },
                    axisLabel: {
                        color: 'rgba(255,255,255,0.7)',
                        rotate: 45,
                        fontSize: 10
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.3)' } },
                    axisLabel: { color: 'rgba(255,255,255,0.7)' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                },
                series: [
                    {
                        name: '创建 PR',
                        type: 'bar',
                        data: repos.map(r => repoStats[r].created),
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#00d2ff' },
                                { offset: 1, color: '#0099cc' }
                            ]),
                            borderRadius: [5, 5, 0, 0]
                        }
                    },
                    {
                        name: '合并 PR',
                        type: 'bar',
                        data: repos.map(r => repoStats[r].merged),
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#3a7bd5' },
                                { offset: 1, color: '#2a5ba5' }
                            ]),
                            borderRadius: [5, 5, 0, 0]
                        }
                    }
                ]
            };
            chart.setOption(option);
        }

        function renderAiVsHumanChart() {
            const chart = echarts.init(document.getElementById('aiVsHumanChart'));
            charts.aiVsHuman = chart;

            const aiPRs = filteredData.filter(d => d.user === 'xgopilot[bot]').reduce((sum, d) => sum + d.createdPRs, 0);
            const humanPRs = filteredData.filter(d => d.user !== 'xgopilot[bot]').reduce((sum, d) => sum + d.createdPRs, 0);

            const option = {
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(0,0,0,0.8)',
                    textStyle: { color: '#fff' }
                },
                series: [{
                    type: 'pie',
                    radius: ['50%', '80%'],
                    center: ['50%', '50%'],
                    data: [
                        {
                            name: 'AI (xgopilot[bot])',
                            value: aiPRs,
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 1, 1, [
                                    { offset: 0, color: '#00d2ff' },
                                    { offset: 1, color: '#0099cc' }
                                ])
                            }
                        },
                        {
                            name: '人类开发者',
                            value: humanPRs,
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 1, 1, [
                                    { offset: 0, color: '#ff6b6b' },
                                    { offset: 1, color: '#cc5555' }
                                ])
                            }
                        }
                    ],
                    label: {
                        show: true,
                        color: '#fff',
                        fontSize: 14,
                        formatter: '{b}\n{c} ({d}%)'
                    },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 20,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            };
            chart.setOption(option);
        }

        function renderAiRatioByRepoChart() {
            const chart = echarts.init(document.getElementById('aiRatioByRepoChart'));
            charts.aiRatioByRepo = chart;

            const repoStats = {};
            filteredData.forEach(d => {
                const repoName = getRepoName(d.repo);
                if (!repoStats[repoName]) {
                    repoStats[repoName] = { ai: 0, total: 0 };
                }
                repoStats[repoName].total += d.createdPRs;
                if (d.user === 'xgopilot[bot]') {
                    repoStats[repoName].ai += d.createdPRs;
                }
            });

            const repos = Object.keys(repoStats)
                .map(r => ({
                    name: r,
                    ratio: repoStats[r].total > 0 ? (repoStats[r].ai / repoStats[r].total * 100) : 0
                }))
                .sort((a, b) => b.ratio - a.ratio);

            const option = {
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(0,0,0,0.8)',
                    textStyle: { color: '#fff' },
                    formatter: '{b}: {c}%'
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: repos.map(r => r.name),
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.3)' } },
                    axisLabel: {
                        color: 'rgba(255,255,255,0.7)',
                        rotate: 45,
                        fontSize: 10
                    }
                },
                yAxis: {
                    type: 'value',
                    max: 100,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.3)' } },
                    axisLabel: {
                        color: 'rgba(255,255,255,0.7)',
                        formatter: '{value}%'
                    },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
                },
                series: [{
                    type: 'bar',
                    data: repos.map(r => ({
                        value: r.ratio.toFixed(1),
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: r.ratio > 80 ? '#00d2ff' : r.ratio > 50 ? '#3a7bd5' : '#ff6b6b' },
                                { offset: 1, color: r.ratio > 80 ? '#0099cc' : r.ratio > 50 ? '#2a5ba5' : '#cc5555' }
                            ]),
                            borderRadius: [5, 5, 0, 0]
                        }
                    }))
                }]
            };
            chart.setOption(option);
        }

        function renderHeatmapChart() {
            const chart = echarts.init(document.getElementById('heatmapChart'));
            charts.heatmap = chart;

            const hourData = Array(24).fill(0).map(() => Array(7).fill(0));
            const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

            filteredData.forEach(d => {
                if (d.earliestTime) {
                    const date = new Date(d.earliestTime.replace(' ', 'T'));
                    if (!isNaN(date)) {
                        const hour = date.getHours();
                        const day = date.getDay();
                        hourData[hour][day] += d.createdPRs;
                    }
                }
            });

            const data = [];
            for (let hour = 0; hour < 24; hour++) {
                for (let day = 0; day < 7; day++) {
                    data.push([day, hour, hourData[hour][day] || 0]);
                }
            }

            const maxValue = Math.max(...data.map(d => d[2]));

            const option = {
                tooltip: {
                    position: 'top',
                    backgroundColor: 'rgba(0,0,0,0.8)',
                    textStyle: { color: '#fff' },
                    formatter: (params) => {
                        return `${dayNames[params.data[0]]} ${params.data[1]}:00<br/>PR 数量: ${params.data[2]}`;
                    }
                },
                grid: {
                    height: '70%',
                    top: '10%'
                },
                xAxis: {
                    type: 'category',
                    data: dayNames,
                    splitArea: { show: true },
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.3)' } },
                    axisLabel: { color: 'rgba(255,255,255,0.7)' }
                },
                yAxis: {
                    type: 'category',
                    data: Array.from({ length: 24 }, (_, i) => `${i}:00`),
                    splitArea: { show: true },
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.3)' } },
                    axisLabel: { color: 'rgba(255,255,255,0.7)' }
                },
                visualMap: {
                    min: 0,
                    max: maxValue || 10,
                    calculable: true,
                    orient: 'horizontal',
                    left: 'center',
                    bottom: '5%',
                    textStyle: { color: '#fff' },
                    inRange: {
                        color: ['#1a1a2e', '#16213e', '#0f3460', '#3a7bd5', '#00d2ff']
                    }
                },
                series: [{
                    type: 'heatmap',
                    data: data,
                    label: { show: false },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            };
            chart.setOption(option);
        }

        function renderUserLeaderboard() {
            const container = document.getElementById('userLeaderboard');

            const userStats = {};
            filteredData.forEach(d => {
                if (!userStats[d.user]) {
                    userStats[d.user] = { created: 0, merged: 0, days: new Set() };
                }
                userStats[d.user].created += d.createdPRs;
                userStats[d.user].merged += d.mergedPRs;
                userStats[d.user].days.add(d.date);
            });

            const sorted = Object.entries(userStats)
                .sort((a, b) => b[1].created - a[1].created)
                .slice(0, 10);

            container.innerHTML = sorted.map(([name, stats], i) => `
                <div class="leaderboard-item">
                    <div class="rank ${i < 3 ? 'rank-' + (i + 1) : 'rank-other'}">${i + 1}</div>
                    <div class="leaderboard-info">
                        <div class="leaderboard-name">${name}${name === 'xgopilot[bot]' ? ' 🤖' : ''}</div>
                        <div class="leaderboard-stats">合并率: ${stats.created > 0 ? ((stats.merged / stats.created) * 100).toFixed(1) : 0}% | 活跃天数: ${stats.days.size}</div>
                    </div>
                    <div class="leaderboard-value">${stats.created}</div>
                </div>
            `).join('');
        }

        function renderRepoLeaderboard() {
            const container = document.getElementById('repoLeaderboard');

            const repoStats = {};
            filteredData.forEach(d => {
                const repoName = getRepoName(d.repo);
                if (!repoStats[repoName]) {
                    repoStats[repoName] = { created: 0, merged: 0, users: new Set() };
                }
                repoStats[repoName].created += d.createdPRs;
                repoStats[repoName].merged += d.mergedPRs;
                repoStats[repoName].users.add(d.user);
            });

            const sorted = Object.entries(repoStats)
                .sort((a, b) => b[1].created - a[1].created)
                .slice(0, 10);

            container.innerHTML = sorted.map(([name, stats], i) => `
                <div class="leaderboard-item">
                    <div class="rank ${i < 3 ? 'rank-' + (i + 1) : 'rank-other'}">${i + 1}</div>
                    <div class="leaderboard-info">
                        <div class="leaderboard-name">${name}</div>
                        <div class="leaderboard-stats">参与人数: ${stats.users.size} | 合并率: ${stats.created > 0 ? ((stats.merged / stats.created) * 100).toFixed(1) : 0}%</div>
                    </div>
                    <div class="leaderboard-value">${stats.created}</div>
                </div>
            `).join('');
        }

        // 响应式处理
        window.addEventListener('resize', () => {
            Object.values(charts).forEach(chart => {
                if (chart && chart.resize) {
                    chart.resize();
                }
            });
        });
    </script>
</body>
</html>
